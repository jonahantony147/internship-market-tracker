name: Daily internship data scrape

on:
  schedule:
    - cron: "0 13 * * *"   # runs once a day at 13:00 UTC (~8am Chicago time)
  workflow_dispatch:        # lets you also trigger this manually from the Actions tab

permissions:
  contents: write            # allows this workflow to push the updated database back

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ingestion script
        run: python src/ingest.py

      - name: Commit and push updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tracker.db
          git diff --staged --quiet || git commit -m "Daily data update: $(date -u +'%Y-%m-%d')"
          git push